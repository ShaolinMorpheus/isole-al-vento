name: Pubblica il gioco

on:
  push:
    branches: [main, master]
    paths: ['www/**', 'bozze/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Numero di versione (l'app si ricarica da sola quando cambia)
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA}/" www/index.html
          printf '%s' "${GITHUB_SHA}" > www/v.txt
      - name: Versione bozza della grafica (copia del gioco in /bozza/, il gioco vero non cambia)
        run: |
          if [ -d bozze/c ]; then
            mkdir -p /tmp/bz && cp -r www/. /tmp/bz/
            mkdir -p www/bozza && cp -r /tmp/bz/. www/bozza/
            cp -r bozze/c/assets/. www/bozza/assets/
            # cache e versione separate, scritta BOZZA, logo un po' piu' in basso
            sed -i "s#register('sw.js?v='+CHANGELOG\[0\].v)#register('sw.js?v=bozzaC-'+CHANGELOG[0].v)#" www/bozza/index.html
            python3 -c "import sys;f='www/bozza/index.html';h=open(f,encoding='utf-8').read();c=open('bozze/c/extra.css',encoding='utf-8').read();open(f,'w',encoding='utf-8').write(h.replace('</head>','<style>'+c+'</style></head>',1))"
            if [ -f bozze/c/extra.js ]; then python3 -c "f='www/bozza/index.html';h=open(f,encoding='utf-8').read();c=open('bozze/c/extra.js',encoding='utf-8').read();m='window.Isole={';assert h.count(m)==1;open(f,'w',encoding='utf-8').write(h.replace(m,c+chr(10)+m,1))"; fi
            sed -i "s#' alpha'#' alpha BOZZA C'#" www/bozza/index.html
            grep -c "bozzaC-" www/bozza/index.html || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
